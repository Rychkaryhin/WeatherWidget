<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Widget 850x500</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body, html {
      width: 850px;
      height: 500px;
      overflow: hidden;
      font-family: 'Inter', 'Segoe UI', Roboto, Helvetica, sans-serif;
      background: transparent;
    }

    .widget-viewport {
      position: relative;
      width: 850px;
      height: 500px;
      overflow: hidden;
    }
    
    .bg-city-name {
      position: absolute;
      top: -90px;
      left: -20px;
      font-size: 200px;
      font-weight: 900;
      color: rgba(255, 255, 255, 0.15);
      text-transform: uppercase;
      letter-spacing: -3px;
      z-index: 1;
      white-space: nowrap;
      pointer-events: none;
    }

    .bg-emoji-shadow {
      position: absolute;
      bottom: -40px;
      right: -40px;
      font-size: 350px;
      opacity: 0.4;
      filter: blur(10px);
      z-index: 1;
      pointer-events: none;
    }

    .main-content {
      position: relative;
      width: 100%;
      height: 100%;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 35px 40px; 
    }

    .real-city-name {
      font-size: 65px;
      font-weight: 800;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: 4px;
      background: rgba(255,255,255,0.15);
      padding: 5px 35px;
      border-radius: 50px;
      backdrop-filter: blur(8px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    }

    .weather-focus {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 30px;
      width: 100%;
    }

    .emoji-main {
      font-size: 160px;
      filter: drop-shadow(0 15px 30px rgba(0,0,0,0.4));
      animation: float 4s ease-in-out infinite;
      line-height: 1;
      margin-top: -10px;
    }

    .temp-main {
      font-size: 160px;
      font-weight: 700;
      color: #fff;
      line-height: 1;
      text-shadow: 0 8px 30px rgba(0,0,0,0.4);
      letter-spacing: -5px;
    }

    .info-bars {
      width: 100%;
    }

    .bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.45);
      backdrop-filter: blur(12px);
      padding: 20px 30px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
      border: 1px solid rgba(255,255,255,0.15);
      width: 100%;
    }

    .bar-desc {
      font-size: 34px;
      font-weight: 700;
      color: #fff;
      border-left: 6px solid #FFCC00;
      padding-left: 20px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      white-space: nowrap;
    }

    .bar-wind {
      font-size: 28px;
      font-weight: 500;
      color: #ddd;
      text-align: right;
      white-space: nowrap;
    }

    .wind-value {
      color: #fff;
      font-weight: 800;
      font-size: 34px;
      margin-left: 10px;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-15px); }
    }

    .fade-in {
      animation: fadeIn 1s ease forwards;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95) translateY(15px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

  </style>
</head>
<body>

  <div class="main-content fade-in" id="main-content">

        <div class="bar-wind">

  function getWeatherMeta(code) {
    const map = {
      0: { e: '☀️', t: 'Ясно, солнечно' },
      1: { e: '🌤️', t: 'Преимущественно ясно' },
      2: { e: '⛅', t: 'Переменная облачность' },
      3: { e: '☁️', t: 'Пасмурно, облачно' },
      45: { e: '🌫️', t: 'Густой туман' },
      51: { e: '🌧️', t: 'Легкий моросящий дождь' },
      61: { e: '🌧️', t: 'Идет дождь' },
      71: { e: '❄️', t: 'Ожидается снег' },
      80: { e: '🌦️', t: 'Кратковременный ливень' },
      95: { e: '⛈️', t: 'Возможна гроза' }
    };
    return map[code] || { e: '🌤️', t: 'Облачно' };
  }

  async function updateWeather() {
    const city = CITIES[Math.floor(Math.random() * CITIES.length)];
    const content = document.getElementById('main-content');

    try {
      const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${city.lat}&longitude=${city.lon}&current_weather=true`);
      if (!res.ok) throw new Error('API Error');
      const data = await res.json();
      const w = data.current_weather;
      const meta = getWeatherMeta(w.weathercode);

      content.classList.remove('fade-in');
      void content.offsetWidth;
      content.classList.add('fade-in');

      document.getElementById('city').innerText = city.name;
      document.getElementById('bg-city').innerText = city.name;
      document.getElementById('temp').innerText = Math.round(w.temperature) + '°';
      document.getElementById('wind').innerText = `${Math.round(w.windspeed)} км/ч`;
      document.getElementById('emoji').innerText = meta.e;
      document.getElementById('bg-emoji').innerText = meta.e;
      document.getElementById('desc').innerText = meta.t;

    } catch (e) {
      console.error("Ошибка обновления погоды:", e);
    }
  }

  setInterval(updateWeather, UPDATE_INTERVAL);
